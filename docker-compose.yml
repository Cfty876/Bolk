version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: vetlogaqua-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: vetlogaqua
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
